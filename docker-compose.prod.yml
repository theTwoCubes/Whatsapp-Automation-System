name: whatsapp

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsapp}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-whatsapp}:${POSTGRES_PASSWORD:-whatsapp}@db:5432/${POSTGRES_DB:-whatsapp}
      # graph.facebook.com publishes an AAAA record, but a default Docker
      # bridge network has no IPv6 route. Node races both families (Happy
      # Eyeballs is on by default from Node 20), so roughly half of all calls
      # to Meta picked the IPv6 address and died with ENETUNREACH, surfacing
      # as "fetch failed" on sends and read receipts. Ordering results is not
      # enough on its own - autoselection still attempts IPv6 - so the race
      # is disabled too, which pins every outbound call to IPv4.
      NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
